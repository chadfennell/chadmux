set -g base-index 1
setw -g pane-base-index 1
set -g default-shell /usr/bin/zsh
set -g history-limit 2000
set -g mouse off
set -g status on

# Status bar colors
set -g status-style bg=green,fg=black
set -g status-left "[#{session_name}] "
set -g status-right "\"#{=21:pane_title}\" %H:%M %d-%b-%y"

# Message colors
set -g message-style bg=yellow,fg=black
set -g message-command-style bg=black,fg=yellow

# Pane display colors
set -g display-panes-active-colour red
set -g display-panes-colour blue

set -g prefix C-s
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Active pane border stands out
set -g pane-border-status bottom
set -g pane-border-format "#[align=right]#{?pane_active,#[bg=#87d787 fg=black] #{pane_title}: #{?@incus,[incus: #{@incus}],#{pane_current_command}} ,#[bg=#444444 fg=white] #{pane_title}: #{?@incus,[incus: #{@incus}],#{pane_current_command}} }#[default]"

# Window name shows the incus instance when the active pane is in one
# (@incus is set per pane by scripts/incus-panes.sh, see bottom of file)
set -g automatic-rename-format "#{?@incus,[incus: #{@incus}],#{?pane_in_mode,[tmux],#{pane_current_command}}#{?pane_dead,[dead],}}"
set -g pane-border-lines heavy
set -g window-active-style bg=terminal
set -g window-style bg=#1a1a2e

## Plugin Meownager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Pluguns'
set -g @plugin 'tmux-plugins/tmux-yank'
set -s set-clipboard on

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dracula/tmux'

set -g @dracula-show-powerline true
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session 
set -g status-position top
set -g @dracula-plugins "cpu-usage ram-usage"
set -g @dracula-show-weather false
set -g status on
set -g @dracula-show-window-tabs true

# Push current pane to a session
bind-key M command-prompt -p "Push pane to:" "join-pane -dt '%%'"

# Toggle to last session
bind-key W switch-client -l
bind-key i last-window


# Refresh tmux
bind-key r source-file $HOME/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
run '~/.tmux/plugins/tpm/tpm'

# Must come after tpm: dracula rewrites status-right. Prints nothing; it just
# refreshes each pane's @incus every status-interval.
set -ga status-right "#(~/.config/tmux/scripts/incus-panes.sh)"
